<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شبیه سازی مداری- APSISTECH</title>
<link rel="stylesheet" href="style.css">

</head>

<body class="apsis-subpage">

<canvas id="spaceCanvas"></canvas>

<div id="pageContent">

<!-- لوگو -->
<svg class="apsis-unified-logo" viewBox="0 0 841.9 595.3" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="logoGradient" x1="334" y1="350" x2="507" y2="350" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#6DCFF6"/>
<stop offset="1" stop-color="#E1F4FD"/>
</linearGradient>
</defs>
<g>
<path fill="url(#logoGradient)" d="M426.4,328.3c32.1,0,60.9,13.7,81,35.6c-18.6-25.1-48.5-41.4-82.1-41.4c-39.6,0-74,22.6-90.9,55.5C354.1,348.1,388,328.3,426.4,328.3z"/>
<polygon fill="#F1F2F2" points="425.4,217.3 359.5,336.9 392.9,307.7 425.4,248.7 452.9,298.7 447,298.7 491.3,336.9"/>
</g>
</svg>

<main >
<div id="madar" class="page content-page">
    <div class="orbit-container">
        <!-- بخش نمایش سه‌بعدی -->
<div class="orbit-viewer" id="threeContainer" style="width: 100%; height: 100%; min-height: 400px;"></div>

        <!-- پنل تنظیمات در سمت راست -->
        <div class="orbit-settings-panel">
            <div class="panel-header">
                <h2>شبیه‌سازی مداری</h2>
                <p>پارامترهای ماهواره را وارد کنید</p>
            </div>

            <form id="orbitForm">
                <div class="form-grid">
                    <div class="form-row">
                        <label>نیم‌محور اصلی (km)</label>
                        <input id="a" type="number" value="7000">
                    </div>
                    <div class="form-row">
                        <label>خروج از مرکز</label>
                        <input id="e" type="number" step="0.001" value="0.01">
                    </div>
                    <div class="form-row">
                        <label>زاویه میل (درجه)</label>
                        <input id="inc" type="number" value="45">
                    </div>
                    <div class="form-row">
                        <label>شناسه گره صعودی</label>
                        <input id="raan" type="number" value="30">
                    </div>
                    <div class="form-row">
                        <label>آرگومان حضیض</label>
                        <input id="argp" type="number" value="40">
                    </div>
                    <div class="form-row">
                        <label>آنومالی واقعی</label>
                        <input id="ta" type="number" value="0">
                    </div>
                    <div class="form-row full-width">
                        <label>زمان شبیه‌سازی (ثانیه)</label>
                        <input id="simTime" type="number" value="5400">
                    </div>
                </div>

                <button id="btnSim" type="submit">اجرای شبیه‌سازی</button>
            </form>

            <div id="orbitStatus">آماده برای پردازش...</div>
        </div>
    </div>
</div>


</main>

<footer class="main-footer">
 <div class="footer-buttons">

        <a href="madar.html" class="footer-card"><span>شبیه‌سازی مداری</span></a>
        <a href="projects.html" class="footer-card"><span>پروژه‌ها</span></a>
        <a href="About.html" class="footer-card"><span>درباره ما</span></a>
        <a href="contact.html" class="footer-card"><span>تماس با ما</span></a>
    </div>
    <div class="footer-content">
        <p>© ۲۰۲۶ تمامی حقوق برای مجموعه مهندسی افق کیهان هوشمند محفوظ است.</p>
    </div>
</footer>

</div>
